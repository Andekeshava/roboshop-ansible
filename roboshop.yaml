- name: creating ec2 user
  connection: local
  hosts: local
  #become: yes
  vars:
    instances: [ "mongodb", "redis", "mysql", "rabbitmq" ]
    action: create
    ami_id: ami-0055977a6e828a4f4
    domain_name: jkrdigital.store
  tasks:
  - name: creating ec2 instance
    amazon.aws.ec2_instance:
      name: "roboshop-{{ item }}"
      region: us-east-1
      instance_type: t3.micro
      image_id: "{{ ami_id }}"
      security_groups:
      - roboshop-common
      - "roboshop-{{ item }}"
    loop: "{{ instances }}"
    when: action == "create"