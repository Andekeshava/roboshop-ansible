- name: configure cart service
  hosts: cart
  become: yes
  tasks:
  - name: disabling
    command: dnf module disable nodejs -y

  - name: enabling 
    command: dnf module enable nodejs:24 -y

  - name: Installing nodejs
    dnf:
      name: nodejs
      state: present

  - name: create roboshop system user
    user: 
      name: roboshop
      create_home: false
      home: /app 
      system: true
      shell: /sbin/nologin
      comment: "roboshop system user"

  - name: remove existing app directory
    file:
      path: /app
      state: absent

  - name: remove cart.zip
    file:
      path: /tmp/cart.zip
      state: absent

  - name: create app directory
    file:
      path: /app
      state: directory

  - name: downloading the code
    get_url:
      url: https://raw.githubusercontent.com/daws-92s/roboshop-documentation/refs/heads/main/artifacts/cart-{{ app_version }}.zip
      dest: /tmp/cart.zip

  - name:  unarchive the code into /app
    unarchive:
      src: /tmp/cart.zip
      dest: /app
      remote_src: yes

  - name: Install npm dependencies
    community.general.npm:
      path: /app             

  - name: copying cart service
    template:
      src: cart.service.j2
      dest: /etc/systemd/system/cart.service

  - name: daemon reload
    systemd_service:
      daemon_reload: true 

  - name: start and enable 
    service:
      name: cart
      state: restarted
      enabled: yes        
