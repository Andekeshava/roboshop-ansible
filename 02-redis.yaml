- name: Configuring redis server
  hosts: redis
  become: true
  tasks:
  - name: Enable redis
    command: dnf module enable redis:7 -y

  - name: Installing redis
    package:
      name: redis
      state: present

  - name: Remove invalid standalone IP lines
    lineinfile:
      path: /etc/redis/redis.conf
      regexp: '^0\.0\.0\.0$'
      state: absent

  - name: Allow remote connections
    lineinfile:
      path: /etc/redis/redis.conf
      regexp: '^\s*bind\s+'
      line: 'bind 0.0.0.0'

  - name: Disable protected mode
    lineinfile:
      path: /etc/redis/redis.conf
      regexp: '^#?protected-mode yes'
      line: 'protected-mode no'

  - name: Enable and restart Redis
    service:
      name: redis
      state: restarted
      enabled: yes      
