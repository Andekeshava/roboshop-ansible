- name: configure payment server
  hosts: payment
  become: yes
  tasks:
  - name: Install python 3.14
    package:
      name:
      - python3.14
      - python3.14-pip
      state: present

  - name: create a roboshop system user
    user:
      name: roboshop
      create_home: false
      home: /app
      shell: /sbin/nologin
      comment: "roboshop system user"

  - name: remove existing app directory
    file:
      path: /app
      state: absent    

  - name: remove existing payment.zip
    file:
      path: /tmp/payment.zip
      state: absent

  - name: create app directory
    file:
      path: /app
      state: directory    

  - name: downloading code
    get_url:
      url: https://raw.githubusercontent.com/daws-92s/roboshop-documentation/refs/heads/main/artifacts/payment-{{ app_version }}.zip
      dest: /tmp/payment.zip

  - name: unarchive the zip file
    unarchive:
      src: /tmp/payment.zip
      dest: /app
      remove_src: yes

  - name: Install dependencies in virtual environment
    pip:
      requirements: /app/requirements.txt
      virtualenv: /app/ .venv
      virtualenv_command: python 3.14 -m venv


  - name: copying payment service
    template:
      src: payment.service.j2
      dest: /etc/systemd/system/payment.service

  - name: daemon reload
    systemd_service:
      daemon_reload: true 

  - name: start and enable 
    service:
      name: payment
      state: restarted
      enabled: yes    


