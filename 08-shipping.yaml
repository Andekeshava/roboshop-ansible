- name: configure shipping service
  hosts: shipping
  become: yes
  tasks:
  - name: Enable maven
    command: dnf module enable maven:3.9 -y
  
  - name: Installing maven
    dnf:
      name:
      - maven
      - java-25-openjdk-devel
      - maven-openjdk25
      - mysql
      state: present

  - name: Create roboshop system user
    user:
      name: roboshop
      create_home: false
      home: /app
      system: true
      shell: /sbin/nologin
      comment: "roboshop system user"   

  - name: Create app directory
    file: 
      path: /app
      state: directory    

  - name: remove existing app directory
    file:
      path: /tmp/shipping.zip
      state: absent

  - name: downloading the shipping source code
    get_url:
      url: https://raw.githubusercontent.com/daws-92s/roboshop-documentation/refs/heads/main/artifacts/shipping-{{app_version}}.zip
      dest: /tmp/shipping.zip

  - name: unarchive the zip file
    unarchive:
      src: /tmp/shipping.zip
      dest: /app
      remote_src: yes     

  - name: mvn version without JAVA_HOME
    command: mvn --version
    args: 
      chdir: /app  
    register: mvn_default

  - name: print mvn version without JAVA_HOME
    debug:
      msg: "{{ mvn_default.stdout_lines }}"    

  - name: Build shipping dependencies
    command: mvn clean package
    args:
      chdir: /app

  - name: Move shiping jar file
    command: mv target/shipping.jar  shipping.jar
    args:
      chdir: /app

  - name: check cities data exist or not
    command: mysql -h "{{ mysql_host }}" -u root -p{{ mysql_root_password }} -N -B -e "SELECT COUNT(*) FROM cities.cities;"
    register: cities_count
    ignore_errors: true
    tags:
    - mysql    

  - name: Print cities count
    debug:
      msg: "{{ cities_count }}"
    tags:
    - mysql  

  - name: Loading cities data
    shell: mysql -h {{ mysql_host }} -uroot -pRoboShop@1 < /app/db/master-data.sql    
    when: cities_count.rc != 0 or cities_count.stdout | int == 0
    tags:
    - mysql

  - name: create app user
    shell: mysql -h {{ mysql_host }} -uroot -p{{ mysql_root_password}} < /app/db/app-user.sql 
    tags:
    - mysql 

  - name: copying and Configuring systemd service 
    template:
      src: shipping.service.j2
      dest: /etc/systemd/system/shipping.service

  - name: demon reload
    systemd_service: 
      daemon_reload: true

  - name: enable and restart
    service:
      name: shipping
      state: restarted
      enabled: yes         


    